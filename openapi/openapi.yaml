                "$ref": "#/components/schemas/Error"
          description: "Missing or invalid session."
      summary: "List the authenticated user's projects."
      tags:
        - "Projects"
    post:
      description: "Creates a project owned by the authenticated user; the user becomes the primary owner. Name is required (non-empty after trim). The created project entity is returned."
      requestBody:
        content:
          application/json:
            schema:
              properties:
                name:
                  description: "Project name (non-empty after trim)."
                  type: "string"
              required:
                - "name"
              type: "object"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ProjectData"
          description: "Project created."
        "400":
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
          description: "Invalid JSON or missing name."
        "401":
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
          description: "Missing or invalid session."
        "413":
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
          description: "Payload Too Large."
      summary: "Create a new project."
      tags:
        - "Projects"
  /projects/doc-status:
    get:
      description: "Returns one entry per snapshot row of the project (globalId → byte length + row timestamp + canonical state hash) so ANY client — including a lone client with no peers — can compare its per-CRDT state against the server (the exchange source for smart-sync). The project is taken from the X-Project-ID header (same authenticated-worker flow as the other project endpoints)."
      parameters:
        - description: "Exclusive lower bound (unix ms) on the snapshot stamp — only rows with stamp > since are returned (stamp == since is excluded)."
          in: "query"
          name: "since"
          required: false
          schema:
            type: "integer"
      responses:
        "200":
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/DocStatusResponse"
          description: "Per-document status returned successfully."
        "401":
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
          description: "Missing or invalid bearer token / project ownership."
        "404":
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
          description: "Unknown project."
      summary: "Get per-document sync status for a project."
      tags:
        - "Projects"
  "/projects/{projectId}/commits":
    get:
      description: "Lists commits (projection never includes manifest_json). Optional query filters: scope=note|vault and docId."
      parameters:
        - in: "path"
          name: "projectId"
          required: true
          schema:
            type: "string"
        - description: "'note' | 'vault'."
          in: "query"
          name: "scope"
          required: false
          schema:
            type: "string"
        - description: "Filter to one document."
          in: "query"
          name: "docId"
          required: false
          schema:
            type: "string"
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  "$ref": "#/components/schemas/CommitInfo"
                type: "array"
          description: "Filtered commit list."
        "401":
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
          description: "Unauthorized."
      summary: "List commits (optional scope/docId filter)."
      tags:
        - "History"
    post:
      description: "Records a commit (scope 'note' = one doc with optional seq; scope 'vault' = whole-vault manifest built from the structure Y.Doc). The note ownership gate (docId must exist in the project structure) runs inside CommitService in ONE transaction (TOCTOU-closed)."
      parameters:
        - in: "path"
          name: "projectId"
          required: true
          schema:
            type: "string"
      requestBody:
        content:
          application/json:
            schema:
              properties:
                docId:
                  description: "Note-scope only: docId that must exist in the project structure."
                  type: "string"
                name:
                  type: "string"
                scope:
                  description: "'note' | 'vault'."
                  type: "string"
                seq:
                  description: "Note-scope only: defaults to the doc max seq."
                  type: "integer"
              required:
                - "scope"
                - "name"
              type: "object"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                type: "object"
          description: "Commit recorded (note scope returns the CommitInfo; vault scope also returns the built manifest)."
        "400":
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
          description: "commit scope must be 'note' or 'vault' (or ownership/seq validation failure)."
        "401":
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
          description: "Unauthorized."
      summary: "Create a note or vault commit."
      tags:
        - "History"
  "/projects/{projectId}/commits/{commitId}":
