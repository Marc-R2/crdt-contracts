components:
  schemas:
    Error:
      properties:
        errorCode:
          description: "A 5-digit error code uniquely identifying this particular type of error."
          example: 40149
          type: "number"
        message:
          description: "Message describing the error."
          example: "A brief description of the error."
          type: "string"
      type: "object"
    FsEntry:
      properties:
        docId:
          description: "Document ID associated with the fs entry."
          type: "string"
        path:
          description: "Path of the fs entry relative to the project root."
          type: "string"
        stamp:
          description: "Unix timestamp of the last update."
          type: "integer"
        status:
          description: "Entry status within the project. Example: \"active\", \"archived\", \"deleted\"."
          type: "string"
      required:
        - "docId"
        - "path"
        - "stamp"
        - "status"
      type: "object"
    GetFsSyncRequest:
      properties:
        entries:
          description: "All file system entries present on the client."
          items:
            "$ref": "#/components/schemas/FsEntry"
          type: "array"
        projectId:
          description: "Project ID (UUID v4)."
          type: "string"
      required:
        - "projectId"
        - "entries"
      type: "object"
    GetFsSyncResponse:
      properties:
        projectId:
          description: "Project ID (UUID v4)."
          format: "uuid"
          type: "string"
        updates:
          description: "List of server-side fs entry updates compared to the client entries."
          items:
            "$ref": "#/components/schemas/FsEntry"
          type: "array"
      required:
        - "projectId"
        - "updates"
      type: "object"
    GetFsUpdatesRequest:
      properties:
        projectId:
          description: "Project ID (UUID v4)."
          type: "string"
        timestamp:
          description: "Unix timestamp after which to retrieve file system updates."
          type: "integer"
      required:
        - "projectId"
        - "timestamp"
      type: "object"
    GetFsUpdatesResponse:
      properties:
        projectId:
          description: "Project ID (UUID v4)."
          type: "string"
        updates:
          description: "List of file system updates since the given timestamp."
          items:
            "$ref": "#/components/schemas/FsEntry"
          type: "array"
      required:
        - "projectId"
        - "updates"
      type: "object"
    GetSnapshotRequest:
      properties:
        docId:
          description: "The document ID of the snapshot to retrieve."
          type: "string"
        projectId:
          description: "The id of the project."
          type: "string"
      required:
        - "projectId"
        - "docId"
      type: "object"
    GetSnapshotResponse:
      properties:
        docId:
          description: "The document ID of the snapshot."
          type: "string"
        hash:
          description: "The hash of the snapshot data."
          type: "string"
        projectId:
          description: "The unique project UUID-V4."
          type: "string"
        snapshotData:
          description: "The data of the snapshot, encoded in base64."
          type: "string"
        stamp:
          description: "The unix timestamp when the snapshot was updated."
          type: "integer"
        status:
          description: "The status of the snapshot within the project. E.g., \"active\", \"archived\", \"deleted\"."
          type: "string"
      required:
        - "projectId"
        - "docId"
        - "snapshotData"
        - "stamp"
        - "hash"
        - "status"
      type: "object"
    GetSnapshotUpdatesRequest:
      properties:
        projectId:
          description: "The id of the project."
          type: "string"
        timestamp:
          description: "The unix timestamp after which to retrieve snapshot updates."
          type: "integer"
      required:
        - "projectId"
        - "timestamp"
      type: "object"
    GetSnapshotUpdatesResponse:
      properties:
        projectId:
          description: "The unique project UUID-V4."
          type: "string"
        updates:
          description: "List of updated snapshots since the given timestamp."
          items:
            "$ref": "#/components/schemas/Snapshot"
          type: "array"
      required:
        - "projectId"
        - "updates"
      type: "object"
    ListSnapshotsRequest:
      properties:
        projectId:
          description: "The id of the project."
          type: "string"
      required:
        - "projectId"
      type: "object"
    ListSnapshotsResponse:
      properties:
        projectId:
          description: "The unique project UUID-V4."
          type: "string"
        snapshotInfos:
          description: "List of all active snapshots-infos within the project."
          items:
            "$ref": "#/components/schemas/SnapshotInfo"
          type: "array"
      required:
        - "projectId"
        - "snapshotInfos"
      type: "object"
    PutFsUpdateRequest:
      properties:
        projectId:
          description: "Project ID (UUID v4)."
          format: "uuid"
          type: "string"
        update:
          "$ref": "#/components/schemas/FsEntry"
      required:
        - "projectId"
        - "update"
      type: "object"
    PutFsUpdateResponse:
      properties:
        newest:
          "$ref": "#/components/schemas/FsEntry"
        projectId:
          description: "Project ID (UUID v4)."
          format: "uuid"
          type: "string"
      required:
        - "projectId"
        - "newest"
      type: "object"
    RegisterProjectRequest:
      properties:
        projectName:
          description: "Human-readable name of the project."
          type: "string"
        publicKey:
          description: "Project public key used by clients."
          type: "string"
      required:
        - "projectName"
        - "publicKey"
      type: "object"
    RegisterProjectResponse:
      properties:
        projectId:
          description: "Unique project UUID v4."
          format: "uuid"
          type: "string"
      required:
        - "projectId"
      type: "object"
    Snapshot:
      properties:
        docId:
          description: "The document ID of the snapshot."
          type: "string"
        hash:
          description: "The hash of the snapshot data."
          type: "string"
        snapshotData:
          description: "The data of the snapshot, encoded in base64."
          type: "string"
        stamp:
          description: "The unix timestamp when the snapshot was updated."
          type: "integer"
        status:
          description: "The status of the snapshot within the project. E.g., \"active\", \"archived\", \"deleted\"."
          type: "string"
      required:
        - "docId"
        - "snapshotData"
        - "stamp"
        - "hash"
        - "status"
      type: "object"
    SnapshotInfo:
      properties:
        docId:
          description: "The document ID of the snapshot."
          type: "string"
        hashPart:
          description: "The first 8 Bytes of the hash."
          type: "string"
      required:
        - "docId"
        - "hashPart"
      type: "object"
info:
  description: |
    REST API for the Obsidian CRDT Sync Server.
    
    This server enables real-time collaboration using Yjs as a CRDT. Documents are synchronized over WebSocket and persisted with SQLite.
    The REST API provides endpoints for project management, file system synchronization, and snapshot access.
    Planned support includes larger files using chunking and binary data transfer.
    
    **Features:**
    - WebSocket-based real-time synchronization
    - SQLite persistence with Hocuspocus
    - Awareness support (cursor, users, selection)
    - Yjs CRDT for conflict-free collaboration
    - Register and manage projects
    - Update and retrieve file system entries
    - Startup synchronization of projects
    
    The WebSocket server runs on port 1234 by default.
  title: "Obsidian CRDT Sync Server API"
  version: "0.0.1"
openapi: "3.0.2"
paths:
  /:
    get:
      description: "Returns basic information about the CRDT Sync Server for health checks."
      responses:
        "200":
          content:
            application/json:
              schema:
                properties:
                  ok:
                    description: "Literal 'OK'."
                    type: "string"
                  service:
                    description: "Service name."
                    type: "string"
                  versions:
                    properties:
                      hocuspocus:
                        description: "Hocuspocus server version."
                        type: "string"
                      self:
                        description: "Server version."
                        type: "string"
                      yjs:
                        description: "Yjs version."
                        type: "string"
                    type: "object"
                type: "object"
          description: "Server info returned successfully."
      summary: "Return basic server information."
      tags:
        - "System"
  /fs/getSync:
    post:
      description: "Compares client entries against the server state and returns the fs-entry updates needed to sync."
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/GetFsSyncRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/GetFsSyncResponse"
          description: "Sync updates returned successfully."
        "400":
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
          description: "Invalid input."
      summary: "Get file system sync updates."
      tags:
        - "File System"
  /fs/getUpdates:
    post:
      description: "Returns all file system updates after a specific timestamp within a project."
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/GetFsUpdatesRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/GetFsUpdatesResponse"
          description: "File system updates returned successfully."
        "400":
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
          description: "Invalid input."
      summary: "Get file system updates."
      tags:
        - "File System"
  /fs/putUpdate:
    put:
      description: "Stores a single fs entry update for a project and returns the newest entry for that document."
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/PutFsUpdateRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/PutFsUpdateResponse"
          description: "Update stored successfully."
        "400":
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
          description: "Invalid input."
      summary: "Submit a file system update."
      tags:
        - "File System"
  /openapi.yaml:
    get:
      responses:
        "200":
          description: "OpenAPI YAML document."
      summary: "Return the OpenAPI YAML document for this API."
      tags:
        - "System"
  /project/register:
    post:
      description: "Registers a new project with the given projectName and publicKey and returns the projectId."
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/RegisterProjectRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/RegisterProjectResponse"
          description: "Project registered successfully."
        "400":
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
          description: "Invalid input."
      summary: "Register a new project and return its projectId."
      tags:
        - "Project"
  /snapshot/get:
    post:
      description: "Get a specific snapshot by its ID in the project."
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/GetSnapshotRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/GetSnapshotResponse"
          description: "Snapshot provided."
        "400":
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
          description: "Invalid input."
      summary: "Get a snapshot."
      tags:
        - "Snapshot"
  /snapshot/getUpdates:
    post:
      description: "Get all updated snapshots after a specific timestamp within a project."
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/GetSnapshotUpdatesRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/GetSnapshotUpdatesResponse"
          description: "Snapshots provided."
        "400":
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
          description: "Invalid input."
      summary: "Get snapshot updates."
      tags:
        - "Snapshot"
  /snapshot/list:
    post:
      description: "Get a list of all snapshot-infos within a project. Snapshot-info is a minimal representation of a snapshot containing only the docId and the first 8 bytes of the hash."
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/ListSnapshotsRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ListSnapshotsResponse"
          description: "Snapshot list returned successfully."
        "400":
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
          description: "Invalid input."
      summary: "Get list of snapshots."
      tags:
        - "Snapshot"
servers:
  - description: "HTTP REST API"
    url: "http://{host}:{port}"
    variables:
      host:
        default: "localhost"
        description: "Server host"
      port:
        default: "1234"
        description: "HTTP port"
  - description: "WebSocket Server (for Yjs synchronization)"
    url: "ws://{host}:{port}"
    variables:
      host:
        default: "localhost"
        description: "Server host"
      port:
        default: "1234"
        description: "WebSocket port"
