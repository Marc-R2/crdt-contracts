components:
  schemas:
    DocId:
      description: "Document ID."
      type: "string"
    DocStatusEntry:
      properties:
        bytes:
          description: "Byte length of the stored Yjs update blob (computed via SQL LENGTH, never materialized)."
          type: "integer"
        stateHash:
          description: "SHA-256 (hex) of the canonical full-state snapshot bytes. Missing for legacy rows that predate the stateHash column."
          type: "string"
        updatedAt:
          "$ref": "#/components/schemas/UnixTimestamp"
          description: "Timestamp (ms) of the snapshot row (the stamp column)."
      required:
        - "bytes"
      type: "object"
    DocStatusResponse:
      properties:
        docs:
          additionalProperties:
            "$ref": "#/components/schemas/DocStatusEntry"
          description: "Per-document status keyed by globalId."
          type: "object"
        maxStamp:
          description: "Max stamp across ALL snapshot rows (independent of the since filter), for client watermarking; 0 when the project has no snapshots."
          type: "integer"
      required:
        - "docs"
        - "maxStamp"
      type: "object"
    Error:
      properties:
        errorCode:
          description: "A 5-digit error code uniquely identifying this particular type of error."
          example: 40149
          type: "number"
        message:
          description: "Message describing the error."
          type: "string"
      type: "object"
    FsEntry:
      properties:
        docId:
          "$ref": "#/components/schemas/DocId"
        globalId:
          "$ref": "#/components/schemas/GlobalId"
        isPresent:
          description: "Indicates if the file or snapshot is present on the server. If false, the file of snapshot is missing - needs to be uploaded by the client."
          type: "boolean"
        path:
          description: "Path of the fs entry relative to the project root. Use forward slashes, no leading slash, case-sensitive."
          type: "string"
        stamp:
          "$ref": "#/components/schemas/UnixTimestamp"
          description: "Client-provided modification time (offline-first). Server validates plausibility and uses LWW by stamp."
        status:
          description: "Entry status within the project. Example: \"active\", \"archived\", \"deleted\"."
          type: "string"
        updated:
          "$ref": "#/components/schemas/UnixTimestamp"
          description: "Server write timestamp for this entry. Used as a tie-breaker when stamps are equal."
      required:
        - "globalId"
        - "docId"
        - "path"
        - "stamp"
        - "status"
      type: "object"
    GetSnapshotRequest:
      properties:
        globalId:
          "$ref": "#/components/schemas/GlobalId"
      required:
        - "globalId"
      type: "object"
    GetSnapshotResponse:
      properties:
        globalId:
          "$ref": "#/components/schemas/GlobalId"
        hash:
          description: "The hash of the snapshot data."
          type: "string"
        snapshotData:
          description: "The data of the snapshot, encoded in base64."
          type: "string"
        stamp:
          "$ref": "#/components/schemas/UnixTimestamp"
        status:
          description: "The status of the snapshot within the project. E.g., \"active\", \"archived\", \"deleted\"."
          type: "string"
      required:
        - "globalId"
        - "snapshotData"
        - "stamp"
        - "hash"
        - "status"
      type: "object"
    GetSnapshotUpdatesRequest:
      properties:
        includeDeleted:
          description: "If true, include deleted snapshots; defaults to false (active only)."
          type: "boolean"
        timestamp:
          "$ref": "#/components/schemas/UnixTimestamp"
      required:
        - "timestamp"
      type: "object"
    GetSnapshotUpdatesResponse:
      properties:
        updates:
          description: "List of updated snapshots since the given timestamp."
          items:
            "$ref": "#/components/schemas/Snapshot"
          type: "array"
      required:
        - "updates"
      type: "object"
    GlobalId:
      description: "Server-assigned globally unique identifier (UUID)."
      format: "uuid"
      type: "string"
    InfoResponse:
      properties:
        ok:
          description: "Literal 'OK'."
          type: "string"
        service:
          description: "Service name."
          type: "string"
        versions:
          properties:
            hocuspocus:
              description: "Hocuspocus server version."
              type: "string"
            protocol:
              description: "Wire-protocol version (integer). Bump on any breaking room-name / entry-schema change."
              type: "integer"
            self:
              description: "Server version."
              type: "string"
            server:
              description: "Server package version."
              type: "string"
            yjs:
              description: "Yjs version."
              type: "string"
          type: "object"
      type: "object"
    ListSnapshotsRequest:
      properties:
        includeDeleted:
          description: "If true, include deleted snapshots; defaults to false (active only)."
          type: "boolean"
      required: []
      type: "object"
    ListSnapshotsResponse:
      properties:
        snapshotInfos:
          description: "List of all active snapshots-infos within the project."
          items:
            "$ref": "#/components/schemas/SnapshotInfo"
          type: "array"
      required:
        - "snapshotInfos"
      type: "object"
    ProjectId:
      description: "Project ID (UUID v4)."
      format: "uuid"
      type: "string"
    Snapshot:
      properties:
        globalId:
          "$ref": "#/components/schemas/GlobalId"
        hash:
          description: "The hash of the snapshot data."
          type: "string"
        snapshotData:
          description: "The data of the snapshot, encoded in base64."
          type: "string"
        stamp:
          "$ref": "#/components/schemas/UnixTimestamp"
        status:
          description: "The status of the snapshot within the project. E.g., \"active\", \"archived\", \"deleted\"."
          type: "string"
      required:
        - "globalId"
        - "snapshotData"
        - "stamp"
        - "hash"
        - "status"
      type: "object"
    SnapshotInfo:
      properties:
        globalId:
          "$ref": "#/components/schemas/GlobalId"
        hashPart:
          description: "The first 8 Bytes of the hash."
          type: "string"
      required:
        - "globalId"
        - "hashPart"
      type: "object"
    UnixTimestamp:
      description: "Unix timestamp in milliseconds."
      type: "integer"
  securitySchemes:
    BearerAuth:
      description: "Opaque bearer token issued by the server (not a JWT)."
      scheme: "bearer"
      type: "http"
info:
  description: |
    REST API for the Obsidian CRDT Sync Server.
    
    This server enables real-time collaboration using Yjs as a CRDT. Documents are synchronized over WebSocket and persisted with SQLite.
    The REST API provides endpoints for project management, snapshot access, and blob transfer.
    Blob upload/download uses raw binary streaming on /blobs/* endpoints (not part of this generated API — see blobRouteHandler.ts).
    
    **Features:**
    - WebSocket-based real-time synchronization
    - SQLite persistence with Hocuspocus
    - Awareness support (cursor, users, selection)
    - Yjs CRDT for conflict-free collaboration
    - Register and manage projects
    - Raw binary blob sync with hash verification and chunked upload
    
    The WebSocket server runs on port 1234 by default.
  title: "Obsidian CRDT Sync Server API"
  version: "0.0.1"
openapi: "3.0.2"
paths:
  /auth/device-tokens:
    post:
      description: "Mints a single-use paste/device token (5 min TTL). Only the SHA-256 hash is persisted; the plaintext code is returned exactly once. Authenticated via bearer token OR the httpOnly portal session cookie. The Obsidian plugin uses the returned code with POST /auth/exchange to obtain a full session."
      requestBody:
        content:
          application/json:
            schema:
              type: "object"
              properties:
                label:
                  type: "string"
                  description: "Optional human-readable label for the device token."
        required: false
      responses:
        "200":
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  code:
                    type: "string"
                    description: "One-time plaintext code (shown only here)."
              description: "Token minted."
        "401":
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
          description: "Missing or invalid session."
      summary: "Mint a single-use device token."
      tags:
        - "Auth"
  /auth/exchange:
    post:
      description: "Exchanges a paste/device code for a full session token. Validates existence, single-use and 5-minute TTL, marks the token used, and creates a session row carrying the device label. Rate-limited to 5 attempts per minute per IP (brute-force bound)."
      requestBody:
        content:
          application/json:
            schema:
              type: "object"
              required:
                - "code"
              properties:
                code:
                  type: "string"
                deviceLabel:
                  type: "string"
                  description: "Label recorded on the created session (shown in the account sessions list)."
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  token:
                    type: "string"
                    description: "New session_ token."
              description: "Session created."
        "400":
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
          description: "Missing code / invalid JSON."
        "401":
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
          description: "Invalid, used, or expired code."
        "429":
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
          description: "Too many exchange attempts."
      summary: "Exchange a device code for a session."
      tags:
        - "Auth"
  /account:
    get:
      description: "Returns the authenticated user's profile. Auth: bearer token OR httpOnly portal session cookie."
      responses:
        "200":
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  id:
                    type: "string"
                  email:
                    type: "string"
                    nullable: true
                  name:
                    type: "string"
                    nullable: true
                  avatarUrl:
                    type: "string"
                    nullable: true
                  googlePicture:
                    type: "string"
                    nullable: true
              description: "Profile returned."
        "401":
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
          description: "Missing or invalid session."
      summary: "Get the authenticated user's profile."
      tags:
        - "Account"
  /account/profile:
    patch:
      description: "Updates the authenticated user's display name / avatar URL. Both fields optional; name must be 1-100 chars, avatarUrl a valid http(s) URL (max 512 chars)."
      requestBody:
        content:
          application/json:
            schema:
              type: "object"
              properties:
                name:
                  type: "string"
                avatarUrl:
                  type: "string"
        required: false
      responses:
        "200":
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  id:
                    type: "string"
                  email:
                    type: "string"
                    nullable: true
                  name:
                    type: "string"
                    nullable: true
                  avatarUrl:
                    type: "string"
                    nullable: true
                  googlePicture:
                    type: "string"
                    nullable: true
              description: "Updated profile returned."
        "400":
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
          description: "Validation failure."
        "401":
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
          description: "Missing or invalid session."
      summary: "Update the user's profile."
      tags:
        - "Account"
  /account/sessions:
    get:
      description: "Lists the authenticated user's active sessions (revoked ones are excluded). The calling session is marked isCurrent=true. Own-session revocation is not allowed."
      responses:
        "200":
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  sessions:
                    type: "array"
                    items:
                      type: "object"
                      properties:
                        id:
                          type: "string"
                        deviceLabel:
                          type: "string"
                          nullable: true
                        lastSeenAt:
                          type: "integer"
                          nullable: true
                        createdAt:
                          type: "integer"
                          nullable: true
                        isCurrent:
                          type: "boolean"
              description: "Session list returned."
        "401":
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
          description: "Missing or invalid session."
      summary: "List the user's active sessions."
      tags:
        - "Account"
  /account/sessions/{id}:
    delete:
      description: "Revokes another active session of the authenticated user (never the current one). Revocation invalidates the session cache immediately."
      parameters:
        - in: "path"
          name: "id"
          required: true
          schema:
            type: "string"
      responses:
        "204":
          description: "Session revoked."
        "400":
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
          description: "Tried to revoke the current session."
        "401":
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
          description: "Missing or invalid session."
        "404":
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
          description: "Session not found / not owned by the user."
      summary: "Revoke another session."
      tags:
        - "Account"
  /account/projects:
    get:
      description: "Lists the authenticated user's project memberships."
      responses:
        "200":
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  projects:
                    type: "array"
                    items:
                      type: "object"
                      properties:
                        id:
                          type: "string"
                        name:
                          type: "string"
              description: "Project list returned."
        "401":
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
          description: "Missing or invalid session."
      summary: "List the user's projects."
      tags:
        - "Account"
  /:
    get:
      description: "Returns basic information about the CRDT Sync Server for health checks."
      responses:
        "200":
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/InfoResponse"
          description: "Server info returned successfully."
      summary: "Return basic server information."
      tags:
        - "System"
  /openapi.yaml:
    get:
      responses:
        "200":
          description: "OpenAPI YAML document."
      summary: "Return the OpenAPI YAML document for this API."
      tags:
        - "System"
  /projects/doc-status:
    get:
      description: "Returns one entry per snapshot row of the project (globalId → byte length + row timestamp + canonical state hash) so ANY client — including a lone client with no peers — can compare its per-CRDT state against the server (the exchange source for smart-sync). The project is taken from the X-Project-ID header (same authenticated-worker flow as the other project endpoints)."
      parameters:
        - description: "Exclusive lower bound (unix ms) on the snapshot stamp — only rows with stamp > since are returned (stamp == since is excluded)."
          in: "query"
          name: "since"
          required: false
          schema:
            type: "integer"
      responses:
        "200":
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/DocStatusResponse"
          description: "Per-document status returned successfully."
        "401":
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
          description: "Missing or invalid bearer token / project ownership."
        "404":
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
          description: "Unknown project."
      summary: "Get per-document sync status for a project."
      tags:
        - "Projects"
  /snapshot/get:
    post:
      description: "Get the newest snapshot for a globalId in the project. Snapshots are mutable and updated incrementally by Hocuspocus."
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/GetSnapshotRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/GetSnapshotResponse"
          description: "Snapshot provided."
        "400":
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
          description: "Invalid input."
      summary: "Get a snapshot."
      tags:
        - "Snapshot"
  /snapshot/getUpdates:
    post:
      description: "Get all updated snapshots after a specific timestamp within a project. Deleted snapshots are excluded unless includeDeleted is true."
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/GetSnapshotUpdatesRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/GetSnapshotUpdatesResponse"
          description: "Snapshots provided."
        "400":
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
          description: "Invalid input."
      summary: "Get snapshot updates."
      tags:
        - "Snapshot"
  /snapshot/list:
    post:
      description: "Get a list of snapshot-infos within a project. Snapshot-info is a minimal representation containing only the docId and the first 8 bytes of the hash. Deleted snapshots are excluded unless includeDeleted is true."
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/ListSnapshotsRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ListSnapshotsResponse"
          description: "Snapshot list returned successfully."
        "400":
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
          description: "Invalid input."
      summary: "Get list of snapshots."
      tags:
        - "Snapshot"
security:
  - BearerAuth: []
servers:
  - description: "HTTP REST API"
    url: "http://{host}:{port}"
    variables:
      host:
        default: "localhost"
        description: "Server host"
      port:
        default: "1234"
        description: "HTTP port"
  - description: "WebSocket Server (for Yjs synchronization)"
    url: "ws://{host}:{port}"
    variables:
      host:
        default: "localhost"
        description: "Server host"
      port:
        default: "1234"
        description: "WebSocket port"
