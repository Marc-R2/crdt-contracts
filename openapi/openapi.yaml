  "/projects/{projectId}/docs/{docId}/chunks":
    get:
      description: "Reads the update range [fromSeq, toSeq] clamped to the doc actual [minSeq, maxSeq] and returns the encoded binary chunk payload (GET returns application/octet-stream; no history / empty range counts 0; FAIL-OPEN on seq gaps on the client side)."
      parameters:
        - in: "path"
          name: "projectId"
          required: true
          schema:
            type: "string"
        - in: "path"
          name: "docId"
          required: true
          schema:
            type: "string"
        - description: "Inclusive lower bound (defaults to the doc min seq)."
          in: "query"
          name: "fromSeq"
          required: false
          schema:
            minimum: 0
            type: "integer"
        - description: "Inclusive upper bound (defaults to the doc max seq)."
          in: "query"
          name: "toSeq"
          required: false
          schema:
            minimum: 0
            type: "integer"
      responses:
        "200":
          content:
            application/octet-stream:
              schema:
