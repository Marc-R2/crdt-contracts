components:
  schemas:
    AuthChallengeRequest:
      properties:
        projectId:
          "$ref": "#/components/schemas/ProjectId"
      required:
        - "projectId"
      type: "object"
    AuthChallengeResponse:
      properties:
        challenge:
          description: "(encypted) The authentication challenge to be solved to authenticate the project."
          type: "string"
        challengeId:
          description: "(encypted) Identifier for the authentication challenge."
          type: "string"
      required:
        - "challengeId"
        - "challenge"
      type: "object"
    AuthProjectRequest:
      properties:
        challengeId:
          description: "Identifier for the authentication challenge."
          type: "string"
        challengeResponse:
          description: "Response to the authentication challenge."
          type: "string"
      required:
        - "challengeId"
        - "challengeResponse"
      type: "object"
    AuthProjectResponse:
      properties:
        token:
          description: "(encypted) Authentication token for the project."
          type: "string"
        ttl:
          description: "Time-to-live (in milliseconds) for the authentication token."
          type: "number"
      required:
        - "token"
        - "ttl"
      type: "object"
    DocId:
      description: "Document ID."
      type: "string"
    Error:
      properties:
        errorCode:
          description: "A 5-digit error code uniquely identifying this particular type of error."
          example: 40149
          type: "number"
        message:
          description: "Message describing the error."
          type: "string"
      type: "object"
    FsEntry:
      properties:
        docId:
          "$ref": "#/components/schemas/DocId"
        globalId:
            "$ref": "#/components/schemas/GlobalId"
        isPresent:
            description: "Indicates if the file or snapshot is present on the server. If false, the file of snapshot is missing - needs to be uploaded by the client."
            type: "boolean"
        path:
          description: "Path of the fs entry relative to the project root. Use forward slashes, no leading slash, case-sensitive."
          type: "string"
        stamp:
          "$ref": "#/components/schemas/UnixTimestamp"
          description: "Client-provided modification time (offline-first). Server validates plausibility and uses LWW by stamp."
        status:
          description: "Entry status within the project. Example: \"active\", \"archived\", \"deleted\"."
          type: "string"
        updated:
          "$ref": "#/components/schemas/UnixTimestamp"
          description: "Server write timestamp for this entry. Used as a tie-breaker when stamps are equal."
      required:
          - "globalId"
        - "docId"
        - "path"
        - "stamp"
        - "status"
      type: "object"
    GetSnapshotRequest:
      properties:
          globalId:
              "$ref": "#/components/schemas/GlobalId"
      required:
          - "globalId"
      type: "object"
    GetSnapshotResponse:
      properties:
          globalId:
              "$ref": "#/components/schemas/GlobalId"
        hash:
          description: "The hash of the snapshot data."
          type: "string"
        snapshotData:
          description: "The data of the snapshot, encoded in base64."
          type: "string"
        stamp:
          "$ref": "#/components/schemas/UnixTimestamp"
        status:
          description: "The status of the snapshot within the project. E.g., \"active\", \"archived\", \"deleted\"."
          type: "string"
      required:
          - "globalId"
        - "snapshotData"
        - "stamp"
        - "hash"
        - "status"
      type: "object"
    GetSnapshotUpdatesRequest:
      properties:
        includeDeleted:
          description: "If true, include deleted snapshots; defaults to false (active only)."
          type: "boolean"
        timestamp:
          "$ref": "#/components/schemas/UnixTimestamp"
      required:
        - "timestamp"
      type: "object"
    GetSnapshotUpdatesResponse:
      properties:
        updates:
          description: "List of updated snapshots since the given timestamp."
          items:
            "$ref": "#/components/schemas/Snapshot"
          type: "array"
      required:
        - "updates"
      type: "object"
    GlobalId:
        description: "Server-assigned globally unique identifier (UUID)."
        format: "uuid"
        type: "string"
    InfoResponse:
        properties:
            ok:
                description: "Literal 'OK'."
                type: "string"
            service:
                description: "Service name."
                type: "string"
            versions:
                properties:
                    hocuspocus:
                        description: "Hocuspocus server version."
                        type: "string"
                    self:
                        description: "Server version."
                        type: "string"
                    yjs:
                        description: "Yjs version."
                        type: "string"
                type: "object"
        type: "object"
    ListSnapshotsRequest:
      properties:
        includeDeleted:
          description: "If true, include deleted snapshots; defaults to false (active only)."
          type: "boolean"
      required: []
      type: "object"
    ListSnapshotsResponse:
      properties:
        snapshotInfos:
          description: "List of all active snapshots-infos within the project."
          items:
            "$ref": "#/components/schemas/SnapshotInfo"
          type: "array"
      required:
        - "snapshotInfos"
      type: "object"
    ProjectId:
      description: "Project ID (UUID v4)."
      format: "uuid"
      type: "string"
    RegisterProjectRequest:
      properties:
        projectName:
          description: "Human-readable name of the project."
          type: "string"
        publicKey:
          description: "Project public key used by clients."
          type: "string"
      required:
        - "projectName"
        - "publicKey"
      type: "object"
    RegisterProjectResponse:
      properties:
        projectId:
          "$ref": "#/components/schemas/ProjectId"
      required:
        - "projectId"
      type: "object"
    Snapshot:
      properties:
          globalId:
              "$ref": "#/components/schemas/GlobalId"
        hash:
          description: "The hash of the snapshot data."
          type: "string"
        snapshotData:
          description: "The data of the snapshot, encoded in base64."
          type: "string"
        stamp:
          "$ref": "#/components/schemas/UnixTimestamp"
        status:
          description: "The status of the snapshot within the project. E.g., \"active\", \"archived\", \"deleted\"."
          type: "string"
      required:
          - "globalId"
        - "snapshotData"
        - "stamp"
        - "hash"
        - "status"
      type: "object"
    SnapshotInfo:
      properties:
          globalId:
              "$ref": "#/components/schemas/GlobalId"
        hashPart:
          description: "The first 8 Bytes of the hash."
          type: "string"
      required:
          - "globalId"
        - "hashPart"
      type: "object"
    UnixTimestamp:
      description: "Unix timestamp in milliseconds."
      type: "integer"
  securitySchemes:
    BearerAuth:
      description: "Opaque bearer token issued by the server (not a JWT)."
      scheme: "bearer"
      type: "http"
info:
  description: |
    REST API for the Obsidian CRDT Sync Server.
    
    This server enables real-time collaboration using Yjs as a CRDT. Documents are synchronized over WebSocket and persisted with SQLite.
      The REST API provides endpoints for project management, snapshot access, and blob transfer.
      Blob upload/download uses raw binary streaming on /blobs/* endpoints (not part of this generated API — see blobRouteHandler.ts).
    
    **Features:**
    - WebSocket-based real-time synchronization
    - SQLite persistence with Hocuspocus
    - Awareness support (cursor, users, selection)
    - Yjs CRDT for conflict-free collaboration
    - Register and manage projects
      - Raw binary blob sync with hash verification and chunked upload
    
    The WebSocket server runs on port 1234 by default.
  title: "Obsidian CRDT Sync Server API"
  version: "0.0.1"
openapi: "3.0.2"
paths:
  /:
    get:
      description: "Returns basic information about the CRDT Sync Server for health checks."
      responses:
        "200":
          content:
            application/json:
              schema:
                  "$ref": "#/components/schemas/InfoResponse"
          description: "Server info returned successfully."
      summary: "Return basic server information."
      tags:
        - "System"
  /openapi.yaml:
    get:
      responses:
        "200":
          description: "OpenAPI YAML document."
      summary: "Return the OpenAPI YAML document for this API."
      tags:
        - "System"
  /project/auth:
    post:
      description: "Authenticate a project by providing the response to the previously obtained authentication challenge."
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/AuthProjectRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AuthProjectResponse"
          description: "Project registered successfully."
        "400":
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
          description: "Invalid input."
      security: []
      summary: "Authenticate a project using the challenge response."
      tags:
        - "Authentication"
  /project/authChallenge:
    post:
      description: "To authenticate for a project, request an authentication challenge using the projectId."
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/AuthChallengeRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AuthChallengeResponse"
          description: "Authentication challenge provided."
        "400":
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
          description: "Invalid input."
      security: []
      summary: "Request an authentication challenge."
      tags:
        - "Authentication"
  /project/register:
    post:
      description: "Registers a new project with the given projectName and publicKey and returns the projectId."
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/RegisterProjectRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/RegisterProjectResponse"
          description: "Project registered successfully."
        "400":
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
          description: "Invalid input."
      security: []
      summary: "Register a new project and return its projectId."
      tags:
        - "Project"
  /snapshot/get:
    post:
        description: "Get the newest snapshot for a globalId in the project. Snapshots are mutable and updated incrementally by Hocuspocus."
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/GetSnapshotRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/GetSnapshotResponse"
          description: "Snapshot provided."
        "400":
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
          description: "Invalid input."
      summary: "Get a snapshot."
      tags:
        - "Snapshot"
  /snapshot/getUpdates:
    post:
      description: "Get all updated snapshots after a specific timestamp within a project. Deleted snapshots are excluded unless includeDeleted is true."
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/GetSnapshotUpdatesRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/GetSnapshotUpdatesResponse"
          description: "Snapshots provided."
        "400":
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
          description: "Invalid input."
      summary: "Get snapshot updates."
      tags:
        - "Snapshot"
  /snapshot/list:
    post:
      description: "Get a list of snapshot-infos within a project. Snapshot-info is a minimal representation containing only the docId and the first 8 bytes of the hash. Deleted snapshots are excluded unless includeDeleted is true."
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/ListSnapshotsRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ListSnapshotsResponse"
          description: "Snapshot list returned successfully."
        "400":
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
          description: "Invalid input."
      summary: "Get list of snapshots."
      tags:
        - "Snapshot"
security:
  - BearerAuth: []
servers:
  - description: "HTTP REST API"
    url: "http://{host}:{port}"
    variables:
      host:
        default: "localhost"
        description: "Server host"
      port:
        default: "1234"
        description: "HTTP port"
  - description: "WebSocket Server (for Yjs synchronization)"
    url: "ws://{host}:{port}"
    variables:
      host:
        default: "localhost"
        description: "Server host"
      port:
        default: "1234"
        description: "WebSocket port"
