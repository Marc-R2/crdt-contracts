components:
  schemas:
    AuthChallengeRequest:
      properties:
        projectId:
          "$ref": "#/components/schemas/ProjectId"
      required:
        - "projectId"
      type: "object"
    AuthChallengeResponse:
      properties:
        challenge:
          description: "(encypted) The authentication challenge to be solved to authenticate the project."
          type: "string"
        challengeId:
          description: "(encypted) Identifier for the authentication challenge."
          type: "string"
      required:
        - "challengeId"
        - "challenge"
      type: "object"
    AuthProjectRequest:
      properties:
        challengeId:
          description: "Identifier for the authentication challenge."
          type: "string"
        challengeResponse:
          description: "Response to the authentication challenge."
          type: "string"
      required:
        - "challengeId"
        - "challengeResponse"
      type: "object"
    AuthProjectResponse:
      properties:
        token:
          description: "(encypted) Authentication token for the project."
          type: "string"
        ttl:
          description: "Time-to-live (in milliseconds) for the authentication token."
          type: "number"
      required:
        - "token"
        - "ttl"
      type: "object"
    DocId:
      description: "Document ID."
      type: "string"
    Error:
      properties:
        errorCode:
          description: "A 5-digit error code uniquely identifying this particular type of error."
          example: 40149
          type: "number"
        message:
          description: "Message describing the error."
          type: "string"
      type: "object"
    FsEntry:
      properties:
        docId:
          "$ref": "#/components/schemas/DocId"
        isPresent:
            description: "Indicates if the file or snapshot is present on the server. If false, the file of snapshot is missing - needs to be uploaded by the client."
            type: "boolean"
        path:
          description: "Path of the fs entry relative to the project root. Use forward slashes, no leading slash, case-sensitive."
          type: "string"
        stamp:
          "$ref": "#/components/schemas/UnixTimestamp"
          description: "Client-provided modification time (offline-first). Server validates plausibility and uses LWW by stamp."
        status:
          description: "Entry status within the project. Example: \"active\", \"archived\", \"deleted\"."
          type: "string"
        updated:
          "$ref": "#/components/schemas/UnixTimestamp"
          description: "Server write timestamp for this entry. Used as a tie-breaker when stamps are equal."
      required:
        - "docId"
        - "path"
        - "stamp"
        - "status"
      type: "object"
    GetFsBlobInfoRequest:
        properties:
            hash:
                description: "Hash of the file content to check."
                type: "string"
        required:
            - "hash"
        type: "object"
    GetFsBlobInfoResponse:
        properties:
            exists:
                description: "True if the blob exists on the server."
                type: "boolean"
        required:
            - "exists"
        type: "object"
    GetFsBlobRequest:
        properties:
            hash:
                description: "Hash of the file content to retrieve."
                type: "string"
        required:
            - "hash"
        type: "object"
    GetFsBlobResponse:
        properties:
            blob:
                description: "Base64-encoded file content."
                type: "string"
            newest:
                "$ref": "#/components/schemas/FsEntry"
        required:
            - "newest"
            - "blob"
      type: "object"
    GetFsSyncRequest:
      properties:
        entries:
          description: "All file system entries present on the client."
          items:
            "$ref": "#/components/schemas/FsEntry"
          type: "array"
      required:
        - "entries"
      type: "object"
    GetFsSyncResponse:
      properties:
        updates:
          description: "List of server-side fs entry updates compared to the client entries."
          items:
            "$ref": "#/components/schemas/FsEntry"
          type: "array"
      required:
        - "updates"
      type: "object"
    GetFsUpdatesRequest:
      properties:
        projectId:
          "$ref": "#/components/schemas/ProjectId"
        timestamp:
          "$ref": "#/components/schemas/UnixTimestamp"
      required:
        - "timestamp"
      type: "object"
    GetFsUpdatesResponse:
      properties:
        updates:
          description: "List of file system updates since the given timestamp."
          items:
            "$ref": "#/components/schemas/FsEntry"
          type: "array"
      required:
        - "updates"
      type: "object"
    GetSnapshotRequest:
      properties:
        docId:
          "$ref": "#/components/schemas/DocId"
      required:
        - "docId"
      type: "object"
    GetSnapshotResponse:
      properties:
        docId:
          "$ref": "#/components/schemas/DocId"
        hash:
          description: "The hash of the snapshot data."
          type: "string"
        snapshotData:
          description: "The data of the snapshot, encoded in base64."
          type: "string"
        stamp:
          "$ref": "#/components/schemas/UnixTimestamp"
        status:
          description: "The status of the snapshot within the project. E.g., \"active\", \"archived\", \"deleted\"."
          type: "string"
      required:
        - "docId"
        - "snapshotData"
        - "stamp"
        - "hash"
        - "status"
      type: "object"
    GetSnapshotUpdatesRequest:
      properties:
        includeDeleted:
          description: "If true, include deleted snapshots; defaults to false (active only)."
          type: "boolean"
        timestamp:
          "$ref": "#/components/schemas/UnixTimestamp"
      required:
        - "timestamp"
      type: "object"
    GetSnapshotUpdatesResponse:
      properties:
        updates:
          description: "List of updated snapshots since the given timestamp."
          items:
            "$ref": "#/components/schemas/Snapshot"
          type: "array"
      required:
        - "updates"
      type: "object"
    InfoResponse:
        properties:
            ok:
                description: "Literal 'OK'."
                type: "string"
            service:
                description: "Service name."
                type: "string"
            versions:
                properties:
                    hocuspocus:
                        description: "Hocuspocus server version."
                        type: "string"
                    self:
                        description: "Server version."
                        type: "string"
                    yjs:
                        description: "Yjs version."
                        type: "string"
                type: "object"
        type: "object"
    ListSnapshotsRequest:
      properties:
        includeDeleted:
          description: "If true, include deleted snapshots; defaults to false (active only)."
          type: "boolean"
      required: []
      type: "object"
    ListSnapshotsResponse:
      properties:
        snapshotInfos:
          description: "List of all active snapshots-infos within the project."
          items:
            "$ref": "#/components/schemas/SnapshotInfo"
          type: "array"
      required:
        - "snapshotInfos"
      type: "object"
    ProjectId:
      description: "Project ID (UUID v4)."
      format: "uuid"
      type: "string"
    PutFsBlobRequest:
        properties:
            blob:
                description: "Base64-encoded file content for this update. Optional if the server already has the blob from a previous update with the same hash."
                type: "string"
            hash:
                description: "Hash of the file content for this update."
                type: "string"
        required:
            - "hash"
            - "blob"
        type: "object"
    PutFsUpdateRequest:
      properties:
        update:
          "$ref": "#/components/schemas/FsEntry"
      required:
        - "update"
      type: "object"
    PutFsUpdateResponse:
      properties:
        newest:
          "$ref": "#/components/schemas/FsEntry"
      required:
        - "newest"
      type: "object"
    RegisterProjectRequest:
      properties:
        projectName:
          description: "Human-readable name of the project."
          type: "string"
        publicKey:
          description: "Project public key used by clients."
          type: "string"
      required:
        - "projectName"
        - "publicKey"
      type: "object"
    RegisterProjectResponse:
      properties:
        projectId:
          "$ref": "#/components/schemas/ProjectId"
      required:
        - "projectId"
      type: "object"
    Snapshot:
      properties:
        docId:
          "$ref": "#/components/schemas/DocId"
        hash:
          description: "The hash of the snapshot data."
          type: "string"
        snapshotData:
          description: "The data of the snapshot, encoded in base64."
          type: "string"
        stamp:
          "$ref": "#/components/schemas/UnixTimestamp"
        status:
          description: "The status of the snapshot within the project. E.g., \"active\", \"archived\", \"deleted\"."
          type: "string"
      required:
        - "docId"
        - "snapshotData"
        - "stamp"
        - "hash"
        - "status"
      type: "object"
    SnapshotInfo:
      properties:
        docId:
          "$ref": "#/components/schemas/DocId"
        hashPart:
          description: "The first 8 Bytes of the hash."
          type: "string"
      required:
        - "docId"
        - "hashPart"
      type: "object"
    UnixTimestamp:
      description: "Unix timestamp in milliseconds."
      type: "integer"
  securitySchemes:
    BearerAuth:
      description: "Opaque bearer token issued by the server (not a JWT)."
      scheme: "bearer"
      type: "http"
info:
  description: |
    REST API for the Obsidian CRDT Sync Server.
    
    This server enables real-time collaboration using Yjs as a CRDT. Documents are synchronized over WebSocket and persisted with SQLite.
    The REST API provides endpoints for project management, file system synchronization, and snapshot access.
    Planned support includes larger files using chunking and binary data transfer.
    
    **Features:**
    - WebSocket-based real-time synchronization
    - SQLite persistence with Hocuspocus
    - Awareness support (cursor, users, selection)
    - Yjs CRDT for conflict-free collaboration
    - Register and manage projects
    - Update and retrieve file system entries
    - Startup synchronization of projects
    
    The WebSocket server runs on port 1234 by default.
  title: "Obsidian CRDT Sync Server API"
  version: "0.0.1"
openapi: "3.0.2"
paths:
  /:
    get:
      description: "Returns basic information about the CRDT Sync Server for health checks."
      responses:
        "200":
          content:
            application/json:
              schema:
                  "$ref": "#/components/schemas/InfoResponse"
          description: "Server info returned successfully."
      summary: "Return basic server information."
      tags:
        - "System"
  /fs/getBlob:
      post:
          description: "Retrieves the newest fs entry and the blob (base64-encoded) for the given file hash. Does not upload or store blobs."
          requestBody:
              content:
                  application/json:
                      schema:
                          "$ref": "#/components/schemas/GetFsBlobRequest"
              required: true
          responses:
              "200":
                  content:
                      application/json:
                          schema:
                              "$ref": "#/components/schemas/GetFsBlobResponse"
                  description: "Newest fs entry and blob retrieved successfully."
              "400":
                  content:
                      application/json:
                          schema:
                              "$ref": "#/components/schemas/Error"
                  description: "Invalid input."
              "404":
                  content:
                      application/json:
                          schema:
                              "$ref": "#/components/schemas/Error"
                  description: "Blob not found for the given hash."
          summary: "Get the newest fs entry and blob for a file hash."
          tags:
              - "File System"
  /fs/getBlobInfo:
      post:
          description: "Checks if a blob exists on the server for the given hash (provided in the request body). Use this endpoint before uploading a blob."
          requestBody:
              content:
                  application/json:
                      schema:
                          "$ref": "#/components/schemas/GetFsBlobInfoRequest"
              required: true
          responses:
              "200":
                  content:
                      application/json:
                          schema:
                              "$ref": "#/components/schemas/GetFsBlobInfoResponse"
                  description: "Blob info retrieved successfully."
              "400":
                  content:
                      application/json:
                          schema:
                              "$ref": "#/components/schemas/Error"
                  description: "Invalid input."
          summary: "Get blob info and check availability by hash."
          tags:
              - "File System"
  /fs/getSync:
    post:
      description: "Compares client entries against the server state and returns the fs-entry updates needed to sync. LWW uses client stamp with server validation; ties are resolved by server write time."
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/GetFsSyncRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/GetFsSyncResponse"
          description: "Sync updates returned successfully."
        "400":
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
          description: "Invalid input."
      summary: "Get file system sync updates."
      tags:
        - "File System"
  /fs/getUpdates:
    post:
      description: "Returns all file system updates after a specific timestamp within a project. Uses LWW by client stamp with server validation."
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/GetFsUpdatesRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/GetFsUpdatesResponse"
          description: "File system updates returned successfully."
        "400":
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
          description: "Invalid input."
      summary: "Get file system updates."
      tags:
        - "File System"
  /fs/putBlob:
      put:
          description: "Stores a file blob on the server and returns the newest fs entry for the corresponding hash. Rejects if the hash is invalid or if the blob already exists."
          requestBody:
              content:
                  application/json:
                      schema:
                          "$ref": "#/components/schemas/PutFsBlobRequest"
              required: true
          responses:
              "200":
                  description: "Blob stored successfully."
              "400":
                  content:
                      application/json:
                          schema:
                              "$ref": "#/components/schemas/Error"
                  description: "Invalid input."
              "409":
                  content:
                      application/json:
                          schema:
                              "$ref": "#/components/schemas/Error"
                  description: "Conflict - blob already exists with the same hash."
          summary: "Store a file blob and get the newest fs entry."
          tags:
              - "File System"
  /fs/putUpdate:
    put:
      description: "Stores a single fs entry update for a project and returns the newest entry for that document. Client stamp is validated; LWW uses stamp and server write time to break ties."
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/PutFsUpdateRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/PutFsUpdateResponse"
          description: "Update stored successfully."
        "400":
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
          description: "Invalid input."
      summary: "Submit a file system update."
      tags:
        - "File System"
  /openapi.yaml:
    get:
      responses:
        "200":
          description: "OpenAPI YAML document."
      summary: "Return the OpenAPI YAML document for this API."
      tags:
        - "System"
  /project/auth:
    post:
      description: "Authenticate a project by providing the response to the previously obtained authentication challenge."
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/AuthProjectRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AuthProjectResponse"
          description: "Project registered successfully."
        "400":
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
          description: "Invalid input."
      security: []
      summary: "Authenticate a project using the challenge response."
      tags:
        - "Authentication"
  /project/authChallenge:
    post:
      description: "To authenticate for a project, request an authentication challenge using the projectId."
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/AuthChallengeRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AuthChallengeResponse"
          description: "Authentication challenge provided."
        "400":
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
          description: "Invalid input."
      security: []
      summary: "Request an authentication challenge."
      tags:
        - "Authentication"
  /project/register:
    post:
      description: "Registers a new project with the given projectName and publicKey and returns the projectId."
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/RegisterProjectRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/RegisterProjectResponse"
          description: "Project registered successfully."
        "400":
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
          description: "Invalid input."
      security: []
      summary: "Register a new project and return its projectId."
      tags:
        - "Project"
  /snapshot/get:
    post:
      description: "Get the newest snapshot for a docId in the project. Snapshots are mutable and updated incrementally by Hocuspocus."
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/GetSnapshotRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/GetSnapshotResponse"
          description: "Snapshot provided."
        "400":
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
          description: "Invalid input."
      summary: "Get a snapshot."
      tags:
        - "Snapshot"
  /snapshot/getUpdates:
    post:
      description: "Get all updated snapshots after a specific timestamp within a project. Deleted snapshots are excluded unless includeDeleted is true."
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/GetSnapshotUpdatesRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/GetSnapshotUpdatesResponse"
          description: "Snapshots provided."
        "400":
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
          description: "Invalid input."
      summary: "Get snapshot updates."
      tags:
        - "Snapshot"
  /snapshot/list:
    post:
      description: "Get a list of snapshot-infos within a project. Snapshot-info is a minimal representation containing only the docId and the first 8 bytes of the hash. Deleted snapshots are excluded unless includeDeleted is true."
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/ListSnapshotsRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ListSnapshotsResponse"
          description: "Snapshot list returned successfully."
        "400":
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
          description: "Invalid input."
      summary: "Get list of snapshots."
      tags:
        - "Snapshot"
security:
  - BearerAuth: []
servers:
  - description: "HTTP REST API"
    url: "http://{host}:{port}"
    variables:
      host:
        default: "localhost"
        description: "Server host"
      port:
        default: "1234"
        description: "HTTP port"
  - description: "WebSocket Server (for Yjs synchronization)"
    url: "ws://{host}:{port}"
    variables:
      host:
        default: "localhost"
        description: "Server host"
      port:
        default: "1234"
        description: "WebSocket port"
