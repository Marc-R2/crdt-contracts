        - "VCS"
  "/projects/{projectId}/vcs/diff":
    get:
      description: "Diff between two revisions. from/to validated by assertSafeRev; path filters to one repo path (assertSafeRepoPath). The worktree diff (no from/to) invokes syncLiveStateToGit which mutates disk - viewer sessions get 403 exactly for that case. Returns the DIFF as plain text (200, text/plain)."
      parameters:
        - in: "path"
          name: "projectId"
          required: true
          schema:
            type: "string"
        - in: "query"
          name: "from"
          required: false
          schema:
            type: "string"
        - in: "query"
          name: "to"
          required: false
          schema:
            type: "string"
        - in: "query"
          name: "path"
          required: false
          schema:
            type: "string"
      responses:
        "200":
          content:
            text/plain:
              schema:
                type: "string"
          description: "Diff output."
        "400":
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/VcsError"
          description: "Project mismatch / invalid rev."
        "401":
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/VcsError"
          description: "Unauthorized."
        "403":
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/VcsError"
          description: "Viewer role cannot inspect the uncommitted live worktree."
      summary: "Diff between revisions (raw unified text)."
      tags:
        - "VCS"
  "/projects/{projectId}/vcs/remotes":
    get:
      parameters:
        - in: "path"
          name: "projectId"
          required: true
          schema:
            type: "string"
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  "$ref": "#/components/schemas/VcsRemote"
                type: "array"
          description: "Remote list."
        "400":
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/VcsError"
          description: "Project mismatch."
        "401":
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/VcsError"
          description: "Unauthorized."
      summary: "List remotes."
      tags:
        - "VCS"
    post:
      parameters:
        - in: "path"
          name: "projectId"
          required: true
          schema:
            type: "string"
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/VcsRemoteRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                properties:
                  ok:
                    type: "boolean"
                type: "object"
          description: "Remote added."
        "400":
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/VcsError"
          description: "name and url are required / validation failed."
        "401":
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/VcsError"
          description: "Unauthorized."
        "403":
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/VcsError"
          description: "Viewer role cannot mutate."
      summary: "Add a remote."
      tags:
        - "VCS"
  "/projects/{projectId}/vcs/remotes/fetch":
    post:
      description: "Fetches `remote` (default 'origin'; assertSafeRemoteName)."
      parameters:
        - in: "path"
          name: "projectId"
          required: true
          schema:
            type: "string"
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/VcsPushFetchRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                type: "object"
          description: "Fetch result."
        "400":
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/VcsError"
          description: "Project mismatch / invalid remote."
        "401":
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/VcsError"
          description: "Unauthorized."
      summary: "Fetch from a remote."
      tags:
        - "VCS"
  "/projects/{projectId}/vcs/remotes/push":
    post:
      description: "Pushes `branch` (or the current HEAD) to `remote` (default 'origin'; assertSafeRemoteName + assertValidBranchName)."
      parameters:
        - in: "path"
          name: "projectId"
          required: true
          schema:
            type: "string"
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/VcsPushFetchRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                type: "object"
          description: "Push result."
        "400":
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/VcsError"
          description: "Project mismatch / invalid remote."
        "401":
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/VcsError"
          description: "Unauthorized."
      summary: "Push to a remote."
      tags:
        - "VCS"
  "/projects/{projectId}/vcs/remotes/{name}":
    delete:
      parameters:
        - in: "path"
          name: "projectId"
          required: true
          schema:
            type: "string"
        - description: "Remote name (assertSafeRemoteName)."
          in: "path"
          name: "name"
          required: true
          schema:
            type: "string"
      responses:
        "200":
          content:
            application/json:
              schema:
                properties:
                  ok:
                    type: "boolean"
                type: "object"
          description: "Remote removed."
        "400":
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/VcsError"
          description: "Invalid remote name."
        "401":
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/VcsError"
          description: "Unauthorized."
        "403":
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/VcsError"
          description: "Viewer role cannot mutate."
      summary: "Remove a remote."
      tags:
        - "VCS"
  "/projects/{projectId}/vcs/restore":
    post:
      description: "Restores a commit (or a single file with `path`). RESTART-gated follow-up: restore must clear tombstoneExpiresAt/deletedAt on the active flip and stop raw snapshotRepo.upsert — documented as OPEN before merge."
      parameters:
        - in: "path"
          name: "projectId"
          required: true
          schema:
            type: "string"
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/VcsRestoreRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                type: "object"
          description: "Restored."
        "400":
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/VcsError"
          description: "Invalid revision (assertSafeRev rejects `-`-prefixed/whitespace revs)."
        "401":
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/VcsError"
          description: "Unauthorized."
        "403":
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/VcsError"
          description: "Viewer role cannot mutate."
      summary: "Restore a historical state."
      tags:
        - "VCS"
  "/projects/{projectId}/vcs/status":
    get:
      description: "Git status (branch, head, ahead/behind, uncommitted files, branches, tags, remotes). Experimental one-way CRDT→Git projection surface."
      parameters:
        - in: "path"
          name: "projectId"
          required: true
          schema:
            type: "string"
      responses:
        "200":
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/VcsStatus"
          description: "Status."
        "400":
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/VcsError"
          description: "Project mismatch."
        "401":
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/VcsError"
          description: "Unauthorized."
      summary: "Working tree + repository status."
      tags:
        - "VCS"
  "/projects/{projectId}/vcs/tags":
    get:
      parameters:
        - in: "path"
          name: "projectId"
          required: true
          schema:
            type: "string"
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  "$ref": "#/components/schemas/VcsTag"
                type: "array"
          description: "Tag list."
        "400":
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/VcsError"
          description: "Project mismatch."
        "401":
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/VcsError"
          description: "Unauthorized."
      summary: "List tags."
      tags:
        - "VCS"
    post:
      description: "Tag an optional commitSha (assertSafeRev); name required (assertValidTagName)."
      parameters:
        - in: "path"
          name: "projectId"
          required: true
          schema:
            type: "string"
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/VcsTagRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                properties:
                  ok:
                    type: "boolean"
                type: "object"
          description: "Tag created."
        "400":
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/VcsError"
          description: "Tag name is required / invalid."
        "401":
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/VcsError"
          description: "Unauthorized."
        "403":
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/VcsError"
          description: "Viewer role cannot mutate."
      summary: "Create a tag."
      tags:
        - "VCS"
  "/projects/{projectId}/vcs/tags/{name}":
    delete:
      parameters:
        - in: "path"
          name: "projectId"
          required: true
          schema:
            type: "string"
        - description: "Tag name (assertValidTagName)."
          in: "path"
          name: "name"
          required: true
          schema:
            type: "string"
      responses:
        "200":
          content:
            application/json:
              schema:
                properties:
                  ok:
                    type: "boolean"
                type: "object"
          description: "Tag deleted."
        "400":
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/VcsError"
          description: "Invalid tag name."
        "401":
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/VcsError"
          description: "Unauthorized."
        "403":
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/VcsError"
          description: "Viewer role cannot mutate."
      summary: "Delete a tag."
      tags:
        - "VCS"
  "/projects/{projectId}/vcs/tree":
    get:
      description: "Entries of the repository tree at commitSha (default HEAD), optionally filtered to one tree path."
      parameters:
        - in: "path"
          name: "projectId"
          required: true
          schema:
            type: "string"
        - description: "Revision (default 'HEAD'; assertSafeRev)."
          in: "query"
          name: "commitSha"
          required: false
          schema:
            type: "string"
        - description: "Sub-tree path (assertSafeRepoPath)."
          in: "query"
          name: "path"
          required: false
          schema:
            type: "string"
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  "$ref": "#/components/schemas/VcsTreeEntry"
                type: "array"
          description: "Tree entries."
        "400":
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/VcsError"
          description: "Project mismatch."
        "401":
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/VcsError"
          description: "Unauthorized."
      summary: "Tree listing at a revision."
      tags:
        - "VCS"
  /snapshot/get:
    post:
      description: "Get the newest snapshot for a globalId in the project. Snapshots are mutable and updated incrementally by Hocuspocus."
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/GetSnapshotRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/GetSnapshotResponse"
          description: "Snapshot provided."
        "400":
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
          description: "Invalid input."
      summary: "Get a snapshot."
      tags:
        - "Snapshot"
  /snapshot/getUpdates:
    post:
      description: "Get all updated snapshots after a specific timestamp within a project. Deleted snapshots are excluded unless includeDeleted is true."
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/GetSnapshotUpdatesRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/GetSnapshotUpdatesResponse"
          description: "Snapshots provided."
        "400":
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
          description: "Invalid input."
      summary: "Get snapshot updates."
      tags:
        - "Snapshot"
  /snapshot/list:
    post:
      description: "Get a list of snapshot-infos within a project. Snapshot-info is a minimal representation containing only the docId and the first 8 bytes of the hash. Deleted snapshots are excluded unless includeDeleted is true."
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/ListSnapshotsRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ListSnapshotsResponse"
          description: "Snapshot list returned successfully."
        "400":
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
          description: "Invalid input."
      summary: "Get list of snapshots."
      tags:
        - "Snapshot"
security:
  - BearerAuth: []
servers:
  - description: "HTTP REST API"
    url: "http://{host}:{port}"
    variables:
      host:
        default: "localhost"
        description: "Server host"
      port:
        default: "1234"
        description: "HTTP port"
  - description: "WebSocket Server (for Yjs synchronization)"
    url: "ws://{host}:{port}"
    variables:
      host:
        default: "localhost"
        description: "Server host"
      port:
        default: "1234"
        description: "WebSocket port"
