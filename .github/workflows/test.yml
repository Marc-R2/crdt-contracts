# Product test gate for the wire-contracts package: build -> OpenAPI gate
# (drift + conformance lint) -> contract tests -> protocol compat gate. No
# submodules, no registry auth, no secrets. (The jsonnet render costs ~100 s
# and the native binding build needs CMake — hence the explicit setup + wider
# timeouts.)
name: Tests

on:
    push:
        branches: [ main ]
    pull_request:
        branches: [ main ]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    test:
        runs-on: ubuntu-latest
        timeout-minutes: 25

        steps:
            -   uses: actions/checkout@v4

            -   name: Setup Node.js 22
                uses: actions/setup-node@v4
                with:
                    node-version: '22'
                    cache: 'npm'

            -   name: Setup CMake
                # @hanazuki/node-jsonnet compiles a native binding via
                # cmake-js; the runner image's preinstalled CMake is not a
                # contract we want to depend on implicitly.
                uses: jwlawson/actions-setup-cmake@v2.2.0
                with:
                    cmake-version: '3.31.x'

            -   name: Install dependencies
                # Cold native build (cmake-js) needs headroom.
                timeout-minutes: 10
                run: npm ci

            -   name: Build
                timeout-minutes: 5
                run: npm run build

            -   name: AGENTS.md size cap
                # A DEAD gate is no gate: this measures the file on every test
                # run instead of trusting a documented cap nobody enforces.
                run: npm run check:agents

            -   name: OpenAPI gate (drift + conformance lint)
                # check:openapi renders openapi/src/** with the pinned jsonnet
                # devDependency, fails when the committed openapi/openapi.yaml
                # or the openapiSha256 pin drifts, then lints the contract
                # (Redocly) so generator-breaking defects (B1 optional path
                # param, M2 nullable-without-type, dead schemas) fail too.
                timeout-minutes: 10
                run: npm run check:openapi

            -   name: Test
                # The openapiPipeline drift-copy test re-renders jsonnet
                # (~2 min) — redundant with the dedicated OpenAPI gate above.
                timeout-minutes: 5
                run: npm test -- --exclude tests/unit/contracts/openapiPipeline.test.ts

            -   name: Compatibility gate
                # Fails on drift between compat-manifest.json and the
                # PROTOCOL_VERSION the built package actually exports.
                timeout-minutes: 5
                run: npm run compat:gate
