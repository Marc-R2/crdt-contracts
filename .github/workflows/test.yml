# Product test gate for the wire-contracts package: build -> contract tests ->
# protocol compat gate. No submodules, no registry auth, no secrets.
name: Tests

on:
    push:
        branches: [ main ]
    pull_request:
        branches: [ main ]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    test:
        runs-on: ubuntu-latest
        timeout-minutes: 15

        steps:
            -   uses: actions/checkout@v4

            -   name: Setup Node.js 22
                uses: actions/setup-node@v4
                with:
                    node-version: '22'
                    cache: 'npm'

            -   name: Install dependencies
                timeout-minutes: 5
                run: npm ci

            -   name: Build
                timeout-minutes: 5
                run: npm run build

            -   name: Test
                timeout-minutes: 10
                run: npm test

            -   name: Compatibility gate
                # Fails on drift between compat-manifest.json and the
                # PROTOCOL_VERSION the built package actually exports.
                timeout-minutes: 5
                run: npm run compat:gate
