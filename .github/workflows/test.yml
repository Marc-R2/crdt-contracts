# Product test gate for the wire-contracts package: build -> OpenAPI drift
# gate -> contract tests -> protocol compat gate. No submodules, no registry
# auth, no secrets. (The jsonnet render costs ~100 s — hence the wider
# timeouts.)
name: Tests

on:
    push:
        branches: [ main ]
    pull_request:
        branches: [ main ]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    test:
        runs-on: ubuntu-latest
        timeout-minutes: 25

        steps:
            -   uses: actions/checkout@v4

            -   name: Setup Node.js 22
                uses: actions/setup-node@v4
                with:
                    node-version: '22'
                    cache: 'npm'

            -   name: Install dependencies
                timeout-minutes: 5
                run: npm ci

            -   name: Build
                timeout-minutes: 5
                run: npm run build

            -   name: OpenAPI drift gate
                # Renders openapi/src/** with the pinned jsonnet devDependency
                # and fails when the committed openapi/openapi.yaml or the
                # openapiSha256 compat-manifest pin drifts.
                timeout-minutes: 10
                run: npm run check:openapi

            -   name: Test
                # The openapiPipeline drift-copy test re-renders jsonnet
                # (~2 min) — redundant with the dedicated drift gate above.
                timeout-minutes: 5
                run: npm test -- --exclude tests/unit/contracts/openapiPipeline.test.ts

            -   name: Compatibility gate
                # Fails on drift between compat-manifest.json and the
                # PROTOCOL_VERSION the built package actually exports.
                timeout-minutes: 5
                run: npm run compat:gate
