# Release pipeline for the wire-contracts package: gate, then a PREBUILT
# `npm pack` tarball attached to the GitHub Release.
#
# WHY A PREBUILT TARBALL AND NOT A GIT DEPENDENCY / prepare HOOK. Consumers
# (`crdt_plugin`, `crdt_server`) install this package from the release asset
# over plain HTTPS with no token. `prepare`/`prepack` would drag CMake plus the
# native `@hanazuki/node-jsonnet` binding into EVERY consumer install, so the
# release asset must already contain `dist/` (compiled CJS + `.d.ts`),
# `src/`, `compat-manifest.json` and the rendered `openapi/openapi.yaml`.
# `npm run release:pack` (see package.json) renders the contract, builds, runs
# the compat gate and packs — the workflow only drives it.
#
# WHY A `vX.Y.Z` TAG. The tag is the release address:
#   https://github.com/Marc-R2/crdt-contracts/releases/download/vX.Y.Z/<asset>
# so the tag MUST be `v` + package.json's version. A mismatch would publish an
# address no consumer pins. `--verify-tag` then refuses to invent a tag.
#
# Future `vX.Y.Z` tags publish automatically (the workflow drives
# `npm run release:pack` + `gh release create`).
name: Release

on:
    push:
        tags: [ 'v*' ]
    workflow_dispatch:
        inputs:
            publish:
                description: >-
                    Create the GitHub Release. FALSE (the default) runs every gate,
                    builds the tarball and publishes NOTHING.
                type: boolean
                default: false

# `contents: write` lets this workflow create a release; stated at the top so
# the blast radius is one greppable line rather than inferred from a token name.
permissions:
    contents: write

concurrency:
    # Grouped by tag: two runs for the same tag must not race to publish.
    # `cancel-in-progress: false` — a cancelled release is a half-published release.
    group: release-${{ github.ref_name }}
    cancel-in-progress: false

jobs:
    release:
        runs-on: ubuntu-latest
        timeout-minutes: 30

        steps:
            -   uses: actions/checkout@v4
                with:
                    # The tag that triggered the run must be visible to `--verify-tag`.
                    fetch-depth: 0

            -   name: Setup Node.js 22
                uses: actions/setup-node@v4
                with:
                    node-version: '22'
                    cache: 'npm'

            -   name: Setup CMake
                # @hanazuki/node-jsonnet compiles a native binding via cmake-js at
                # `npm ci` time; do not depend on the runner image's CMake.
                uses: jwlawson/actions-setup-cmake@v2.2.0
                with:
                    cmake-version: '3.31.x'

            -   name: Install dependencies
                timeout-minutes: 10
                run: npm ci

            -   name: Verify the tag matches package.json
                # The release address is built from the tag, so a tag that is not
                # exactly `v` + package.json's version must fail LOUDLY before anything
                # is published. `compat-manifest.json.contracts` is asserted equal to
                # package.json.version by `npm run compat:gate` inside release:pack.
                env:
                    REF_NAME: ${{ github.ref_name }}
                run: |
                    set -euo pipefail
                    version="$(node -p "require('./package.json').version")"
                    expected="v${version}"
                    if [ "${REF_NAME}" != "${expected}" ]; then
                        echo "::error title=Tag does not match package.json::tag '${REF_NAME}' but package.json declares '${version}' (expected '${expected}'). Nothing was published."
                        exit 1
                    fi

            -   name: Build, gate and pack the tarball
                # Renders openapi.yaml, builds dist/, runs the compat gate (contracts
                # version + openapiSha256 pin) and writes the prebuilt tarball.
                timeout-minutes: 20
                run: npm run release:pack

            -   name: Locate and inspect the tarball
                id: pack
                # ASSERT the consumer-required entries are present BEFORE uploading:
                # `gh release create` uploads whatever it is given, so a missing
                # `dist/` or `openapi/openapi.yaml` would only surface as a broken
                # consumer install.
                run: |
                    set -euo pipefail
                    shopt -s nullglob
                    tarballs=(marc-r2-crdt-contracts-*.tgz)
                    if [ "${#tarballs[@]}" -ne 1 ]; then
                        echo "::error title=Expected exactly one tarball::found ${#tarballs[@]} in $(pwd). Nothing was published."
                        exit 1
                    fi
                    tarball="${tarballs[0]}"
                    test -s "${tarball}" || { echo "::error title=Empty tarball::${tarball} is zero bytes."; exit 1; }

                    listing="$(tar -tzf "${tarball}")"
                    for required in \
                        package/dist/index.js \
                        package/dist/index.d.ts \
                        package/src/index.ts \
                        package/compat-manifest.json \
                        package/openapi/openapi.yaml \
                        package/package.json; do
                        if ! grep -qx "${required}" <<< "${listing}"; then
                            echo "::error title=Missing tarball entry::${required} is absent from ${tarball}. Nothing was published."
                            exit 1
                        fi
                    done
                    if grep -q 'swagger-ui' <<< "${listing}"; then
                        echo "::error title=Swagger UI bundle in tarball::${tarball} ships multi-MB swagger-ui bundles that consumers do not need."
                        exit 1
                    fi

                    echo "tarball=${tarball}" >> "${GITHUB_OUTPUT}"

            -   name: Publish the GitHub Release
                if: ${{ github.event_name == 'push' || inputs.publish == true }}
                # `github.token` is minted from the `permissions:` block above and
                # expires with the job; `GH_TOKEN` is where `gh` reads it.
                env:
                    GH_TOKEN: ${{ github.token }}
                    REF_NAME: ${{ github.ref_name }}
                    TARBALL: ${{ steps.pack.outputs.tarball }}
                run: |
                    set -euo pipefail
                    # `--verify-tag` refuses to create a tag: the release must hang off
                    # the tag that was pushed. Notes go via stdin so nothing in the body
                    # is built by shell-quoting an expression.
                    gh release create "${REF_NAME}" \
                        --verify-tag \
                        --title "${REF_NAME}" \
                        --notes-file - \
                        "${TARBALL}" <<NOTES
                    Wire contracts ${REF_NAME}.

                    Prebuilt npm tarball (CommonJS + .d.ts). Consumers install it over
                    plain HTTPS with no token:

                    \`\`\`json
                    "@marc-r2/crdt-contracts": "https://github.com/Marc-R2/crdt-contracts/releases/download/${REF_NAME}/${TARBALL}"
                    \`\`\`

                    Nothing builds on the consumer machine: \`dist/\`, \`src/\`,
                    \`compat-manifest.json\` and the rendered \`openapi/openapi.yaml\` are
                    already inside the tarball.
                    NOTES

            -   name: Verify the published release
                if: ${{ github.event_name == 'push' || inputs.publish == true }}
                # `gh release create` exiting 0 means GitHub accepted the request; it
                # does not prove the asset is visible and non-empty. Ask the API the
                # same question a consumer's `npm install` will ask.
                env:
                    GH_TOKEN: ${{ github.token }}
                    REF_NAME: ${{ github.ref_name }}
                    TARBALL: ${{ steps.pack.outputs.tarball }}
                run: |
                    set -euo pipefail
                    gh release view "${REF_NAME}" --json isDraft,assets,tagName \
                        | node -e '
                            const REQUIRED = process.env.TARBALL;
                            let raw = "";
                            process.stdin.on("data", chunk => (raw += chunk));
                            process.stdin.on("end", () => {
                                const release = JSON.parse(raw);
                                const problems = [];
                                if (release.tagName !== process.env.REF_NAME) problems.push(`tagName is ${release.tagName}, expected ${process.env.REF_NAME}`);
                                if (release.isDraft) problems.push("the release is a DRAFT");
                                const asset = release.assets.find(a => a.name === REQUIRED);
                                if (!asset) problems.push(`missing asset ${REQUIRED}`);
                                else if (asset.size === 0) problems.push(`asset ${REQUIRED} is zero bytes`);
                                if (problems.length > 0) {
                                    for (const problem of problems) console.log(`::error title=Release verification failed::${problem}`);
                                    process.exit(1);
                                }
                                console.log(`release ${release.tagName}: asset ${REQUIRED} verified, not a draft`);
                            });
                        '
